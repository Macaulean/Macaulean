name = "Macaulean"
version = "0.1.0"
defaultTargets = ["macaulean"]
testDriver = "MacauleanTest"

# Mathematical Gröbner certification uses Mathlib's polynomial semantics.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[input_file]]
name = "buchbergerSource"
path = "Macaulean/Interpreter/Buchberger.m2"
text = true

[[input_file]]
name = "gcdSource"
path = "Macaulean/Interpreter/GCD.m2"
text = true

[[input_file]]
name = "intentWidgetTest"
path = "scripts/intent-widget.test.mjs"
text = true

[[lean_lib]]
name = "Macaulean"
roots = ["Macaulean", "Macaulean.Verification"]
needs = ["buchbergerSource", "gcdSource"]
precompileModules = true

[[lean_lib]]
name = "MRDI"
roots = ["MRDI", "MRDI.Poly", "MRDI.Uuid"]
precompileModules = true

[[lean_lib]]
name = "MacauleanTest"
needs = ["intentWidgetTest"]

[[lean_exe]]
name = "macaulean"
root = "Main"

# Proof-only certification layer; importing Mathlib must not require native
# compilation of every Mathlib module used by the theorem library.
[[lean_lib]]
name = "MacauleanMathlib"
precompileModules = false

[[lean_lib]]
name = "MacauleanMathlibTest"
