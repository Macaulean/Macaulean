name: Publish Verified Polynomial Repair
on:
  push:
    branches: [verification/m2-ci-environment-20260927]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Apply reviewed changes with exact source and output checks
        shell: bash
        env:
          TARGET: feature/m2-polynomial-ring-20260927
          EXPECTED: 0c39581fd0e6244cc6011ccab5a7ef46a76647e4
          PAYLOAD: 
        run: |
          set -euo pipefail
          git fetch origin "$TARGET" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED"
          git checkout --detach "$EXPECTED"
          python3 - <<'PY'
          import os, json, zlib, base64, hashlib, pathlib, subprocess
          raw = zlib.decompress(base64.b64decode(os.environ['PAYLOAD']))
          assert hashlib.sha256(raw).hexdigest() == 'c0965a0ac9506da633ce69becf35820d3df981f43334d7b1330233c85f341f2d'
          data = json.loads(raw)
          paths = data['expected']
          assert all(not p.startswith('/') and '..' not in pathlib.PurePosixPath(p).parts and not p.startswith('.github/') for p in paths)
          pathlib.Path('/tmp/repair.patch').write_text(data['patch'])
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/repair.patch'],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero','/tmp/repair.patch'],check=True)
          for path, content in data['replace'].items():
              assert path in paths
              pathlib.Path(path).write_text(content)
          subprocess.run(['git','add','--',*data['replace']],check=True)
          for path, expected in paths.items():
              actual = subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual == expected, (path,actual,expected)
          actual_paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(actual_paths) == set(paths), (actual_paths,list(paths))
          PY
          git diff --cached --check
          git diff --cached --stat
          git -c user.name='Macaulean automation' -c user.email='noreply@github.com' commit -m 'fix(polynomials): kernel reduction, native identity and binding semantics'
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$EXPECTED"
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD
