name: M2 proof-job isolation and kernel replay

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install isolated worker support
        run: sudo apt-get update && sudo apt-get install -y bubblewrap python3 apparmor-profiles apparmor-utils
      - name: Permit the distribution sandbox to create its isolated namespaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          setting=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -e "$setting" ]]; then
            cat "$setting" > ci-evidence/userns-policy-before.txt
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$profile"
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            cat "$setting" > ci-evidence/userns-policy-after.txt
            cmp ci-evidence/userns-policy-before.txt ci-evidence/userns-policy-after.txt
          fi
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
      - name: Record exact smoke baseline
        run: |
          mkdir -p ci-evidence
          git rev-parse HEAD > ci-evidence/stage2-commit.txt
          lean --version > ci-evidence/stage2-lean-version.txt
          bwrap --version > ci-evidence/stage2-sandbox-version.txt
      - name: Real kernel proof and two-process replay smoke
        shell: bash
        run: bash scripts/m2_proof_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-stage2-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          retention-days: 7
          if-no-files-found: error
